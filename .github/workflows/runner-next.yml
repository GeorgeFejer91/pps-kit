name: Cross-platform Runner preview

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/designer/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-audio-cpal/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-experiment-media/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_experiment_profile_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - "For-AI/engineering/tests/test_rust_response_differential.py"
      - "For-AI/engineering/tests/test_native_result_file_audit.py"
      - "For-AI/engineering/tests/test_planner_worker_protocol.py"
      - "For-AI/engineering/validation/scripts/validate_native_results.py"
      - "For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_runner_output_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_runner_participant_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_planner_webview_audit.py"
      - "For-AI/engineering/validation/scripts/run_designer_visual_layout_audit.py"
      - "For-AI/engineering/release/tools/package_inventory.py"
      - ".github/workflows/runner-next.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/designer/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-audio-cpal/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-experiment-media/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_experiment_profile_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - "For-AI/engineering/tests/test_rust_response_differential.py"
      - "For-AI/engineering/tests/test_native_result_file_audit.py"
      - "For-AI/engineering/tests/test_planner_worker_protocol.py"
      - "For-AI/engineering/validation/scripts/validate_native_results.py"
      - "For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_runner_output_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_runner_participant_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_planner_webview_audit.py"
      - "For-AI/engineering/validation/scripts/run_designer_visual_layout_audit.py"
      - "For-AI/engineering/release/tools/package_inventory.py"
      - ".github/workflows/runner-next.yml"
  workflow_dispatch:
    inputs:
      installed_artifact_run_id:
        description: Existing validation run ID for a fast installed-WebView audit retry
        required: false
        type: string
      installed_artifact_commit:
        description: Exact commit recorded in that run's Windows validation artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  rust-core:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install Linux native-audio prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Check and test transport-neutral Rust crates
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Core

  desktop-shell:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Tauri desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config
      - name: Check and test the native desktop shell
        env:
          PPS_NATIVE_RESULT_FIXTURE_DIR: ${{ runner.temp }}/native-result-fixture
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Desktop
      - name: Retain synthetic native writer files for the independent oracle
        uses: actions/upload-artifact@v7
        with:
          name: native-result-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/native-result-fixture
          if-no-files-found: error

  python-rust-package-oracle:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Python/Rust V1 package oracle (${{ matrix.os }})
    needs: desktop-shell
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install the Python oracle and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,web]"
      - name: Read the same host's synthetic native writer files
        uses: actions/download-artifact@v5
        with:
          name: native-result-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/native-result-fixture
      - name: Compare Rust verification with the Python V1 oracle
        env:
          PPS_NATIVE_RESULT_FIXTURE_DIR: ${{ runner.temp }}/native-result-fixture
        run: >-
          python -m pytest -q
          For-AI/engineering/tests/test_rust_session_package_differential.py
          For-AI/engineering/tests/test_rust_experiment_profile_differential.py
          For-AI/engineering/tests/test_rust_timing_schedule_differential.py
          For-AI/engineering/tests/test_rust_response_differential.py
          For-AI/engineering/tests/test_native_result_file_audit.py
          For-AI/engineering/tests/test_planner_worker_protocol.py

  browser-companion:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Browser interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build bundled browser frontend
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Browser
      - name: Install pinned rendered-UI audit tools
        run: |
          python -m pip install playwright==1.61.0 Pillow==12.2.0
          python -m playwright install --with-deps chromium
      - name: Audit rendered Runner profile controls
        run: python For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py
      - name: Audit rendered Runner output and participant controls
        run: |
          python For-AI/engineering/validation/scripts/run_runner_output_ui_audit.py
          python For-AI/engineering/validation/scripts/run_runner_participant_ui_audit.py
      - name: Audit rendered Planner segments at twelve viewport sizes
        run: |
          npm --prefix apps/designer/frontend ci
          npm --prefix apps/designer/frontend run build
          git diff --exit-code -- apps/designer/frontend/compiled
          python For-AI/engineering/validation/scripts/run_designer_visual_layout_audit.py
      - name: Retain rendered Runner profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-profile-ui-${{ github.sha }}
          path: artifacts/runner-profile-ui-audit
          if-no-files-found: warn
      - name: Retain rendered Runner output and participant evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-control-ui-${{ github.sha }}
          path: |
            artifacts/runner-output-ui-audit
            artifacts/runner-participant-ui-audit
          if-no-files-found: warn
      - name: Retain rendered Planner segment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planner-visual-${{ github.sha }}
          path: artifacts/designer_visual_layout_audit
          if-no-files-found: warn

  desktop-validation-bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Validation bundle (${{ matrix.slug }})
    needs: [desktop-shell, browser-companion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-host-nsis
            bundle: nsis
            bundle_glob: target/release/bundle/nsis/*-setup.exe
            signing: unsigned
            no_sign: true
          - os: macos-latest
            slug: macos-host-dmg
            bundle: dmg
            bundle_glob: target/release/bundle/dmg/*.dmg
            signing: ad-hoc-not-notarized
            no_sign: false
          - os: ubuntu-22.04
            slug: linux-host-deb
            bundle: deb
            bundle_glob: target/release/bundle/deb/*.deb
            signing: unsigned
            no_sign: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: actions/setup-python@v5
        if: matrix.slug == 'windows-host-nsis'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux Tauri packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install locked frontend dependencies
        working-directory: apps/runner
        run: npm ci
      - name: Build one host-native validation bundle
        shell: pwsh
        working-directory: apps/runner
        run: |
          $arguments = @(
            "run", "tauri", "--", "build",
            "--ci",
            "--bundles", "${{ matrix.bundle }}",
            "--config", "src-tauri/tauri.validation.conf.json"
          )
          if ("${{ matrix.no_sign }}" -eq "true") {
            $arguments += "--no-sign"
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Reject generated-source or lock drift
        run: git diff --exit-code -- Cargo.lock apps/runner/compiled
      - name: Stage validation-only artifact
        id: stage_validation
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path "${{ matrix.bundle_glob }}" -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.bundle }} bundle, found $($bundles.Count)."
          }

          $unexpectedUpdaterFiles = @(
            Get-ChildItem target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -eq ".sig" -or $_.Name -eq "latest.json" }
          )
          if ($unexpectedUpdaterFiles.Count -ne 0) {
            throw "Validation builds must not create updater artifacts."
          }

          $stage = "dist/runner-validation/${{ matrix.slug }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $destination = Join-Path $stage $bundles[0].Name
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $destination

          @(
            "schema=pps-runner-packaging-validation.v1"
            "commit=${{ github.sha }}"
            "runner_os=${{ runner.os }}"
            "runner_arch=${{ runner.arch }}"
            "bundle=${{ matrix.bundle }}"
            "signing=${{ matrix.signing }}"
            "distribution_status=ci_validation_artifact_not_release"
            "scientific_status=sequential_native_blocks_candidate_unqualified"
            "use_for_data_collection=false"
            "updater=false"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "VALIDATION_ONLY.txt")

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $destination
          "$($hash.Hash.ToLowerInvariant())  $($bundles[0].Name)" |
            Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
      - name: Check fresh Windows installer inventory
        if: matrix.slug == 'windows-host-nsis'
        shell: pwsh
        run: |
          $stage = "dist/runner-validation/windows-host-nsis"
          $installer = @(Get-ChildItem -LiteralPath $stage -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one staged NSIS installer." }
          $installRoot = Join-Path $env:RUNNER_TEMP "pps-runner-install-${{ github.run_id }}-${{ github.run_attempt }}"
          if ($installRoot -match '\s' -or (Test-Path -LiteralPath $installRoot)) {
            throw "The CI install directory must be fresh and contain no spaces."
          }
          $process = Start-Process -FilePath $installer[0].FullName `
            -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS silent install failed: $($process.ExitCode)." }
          $binary = Join-Path $installRoot 'pps-experiment-runner.exe'
          $installedHtml = Join-Path $installRoot 'web/index.html'
          $installedCss = Join-Path $installRoot 'web/assets/style.css'
          foreach ($path in @($binary, $installedHtml, $installedCss)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "The installed Runner inventory is incomplete: $path"
            }
          }
          $htmlHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedHtml).Hash.ToLowerInvariant()
          $cssHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedCss).Hash.ToLowerInvariant()
          if ($htmlHash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'apps/runner/compiled/index.html').Hash.ToLowerInvariant() -or
              $cssHash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'apps/runner/compiled/assets/style.css').Hash.ToLowerInvariant()) {
            throw "Installed frontend resource bytes differ from the canonical compiled files."
          }
          @(
            'schema=pps-runner-installed-inventory.v1'
            "commit=${{ github.sha }}"
            'scope=ci_silent_install_inventory_only'
            "binary_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant())"
            "html_sha256=$htmlHash"
            "css_sha256=$cssHash"
            'webview_launched=false'
            'physical_output_qualified=false'
          ) | Set-Content -Encoding ascii (Join-Path $stage 'INSTALL_INVENTORY.txt')
          "PPS_INSTALLED_RUNNER=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned installed-UI audit drivers
        if: matrix.slug == 'windows-host-nsis'
        run: python -m pip install --disable-pip-version-check playwright==1.61.0 pywinauto==0.6.9
      - name: Exercise installed Runner profile, generated media, schedule, and PCM preparation
        if: matrix.slug == 'windows-host-nsis'
        shell: pwsh
        run: |
          $audit = 'artifacts/runner-installed-webview-audit'
          python For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py `
            --binary $env:PPS_INSTALLED_RUNNER --output-dir $audit --commit '${{ github.sha }}' --elevated-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath (Join-Path $audit 'report.json') -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.commit -ne '${{ github.sha }}' -or
              -not $report.planner_profile_package_generated -or
              -not $report.profile_rust_schedule_compiled -or -not $report.profile_native_pcm_prepared) {
            throw 'Installed WebView audit report does not match this build.'
          }
          $stage = 'dist/runner-validation/windows-host-nsis'
          Copy-Item -LiteralPath (Join-Path $audit 'report.json') -Destination (Join-Path $stage 'WEBVIEW_AUDIT.json')
          $inventory = Join-Path $stage 'INSTALL_INVENTORY.txt'
          (Get-Content -LiteralPath $inventory) `
            -replace 'scope=ci_silent_install_inventory_only', 'scope=ci_silent_install_profile_media_package_schedule_pcm_audit' `
            -replace 'webview_launched=false', 'webview_launched=true' |
            Set-Content -Encoding ascii -LiteralPath $inventory
          "webview_audit_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $stage 'WEBVIEW_AUDIT.json')).Hash.ToLowerInvariant())" |
            Add-Content -Encoding ascii -LiteralPath $inventory
      - name: Retain installed WebView screenshots and failure report
        if: always() && matrix.slug == 'windows-host-nsis'
        uses: actions/upload-artifact@v7
        with:
          name: runner-installed-webview-${{ github.sha }}
          path: artifacts/runner-installed-webview-audit
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always() && steps.stage_validation.outcome == 'success'
        with:
          name: pps-runner-preview-validation-${{ matrix.slug }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/runner-validation/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  installed-webview-retry:
    name: Installed WebView audit from existing Windows bundle
    if: inputs.installed_artifact_run_id != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.installed_artifact_run_id }}
          name: pps-runner-preview-validation-windows-host-nsis-X64-${{ inputs.installed_artifact_commit }}
          github-token: ${{ github.token }}
          path: artifacts/installed-audit-source
      - name: Verify and install the exact validation artifact
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.installed_artifact_commit }}
        run: |
          $source = 'artifacts/installed-audit-source'
          $marker = Get-Content -LiteralPath (Join-Path $source 'VALIDATION_ONLY.txt')
          if ($marker -notcontains "commit=$env:SOURCE_COMMIT" -or
              $marker -notcontains 'distribution_status=ci_validation_artifact_not_release') {
            throw 'Validation marker does not match the requested commit.'
          }
          $installer = @(Get-ChildItem -LiteralPath $source -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected one Windows NSIS installer.' }
          $expectedHash = ((Get-Content -LiteralPath (Join-Path $source 'SHA256SUMS.txt')) -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw 'Validation installer hash mismatch.' }
          $installRoot = Join-Path $env:RUNNER_TEMP "pps-runner-audit-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $installRoot) { throw 'Install directory is not fresh.' }
          $process = Start-Process -FilePath $installer[0].FullName `
            -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)." }
          $binary = Join-Path $installRoot 'pps-experiment-runner.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Installed Runner missing.' }
          "PPS_INSTALLED_RUNNER=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned installed-UI audit drivers
        run: python -m pip install --disable-pip-version-check playwright==1.61.0 pywinauto==0.6.9
      - name: Exercise installed Runner profile, generated media, schedule, and PCM preparation
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.installed_artifact_commit }}
        run: |
          python For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py `
            --binary $env:PPS_INSTALLED_RUNNER `
            --output-dir artifacts/runner-installed-webview-audit `
            --commit $env:SOURCE_COMMIT --elevated-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installed audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-installed-webview-retry-${{ inputs.installed_artifact_commit }}
          path: artifacts/runner-installed-webview-audit
          if-no-files-found: warn

  quest-apk:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Optional native Quest APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android toolchain
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Test, build, and lint the native Quest preview
        working-directory: apps/quest-runner
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

  planner-windows-validation:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Planner Windows validation bundle
    needs: [desktop-shell, browser-companion]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/designer/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install locked Planner frontend dependencies
        run: npm --prefix apps/designer/frontend ci
      - name: Build the private Python Planner worker
        shell: pwsh
        run: ./For-AI/engineering/build/windows/Build_PPS_Planner_Worker.ps1
      - name: Build one host-native Planner validation installer
        shell: pwsh
        working-directory: apps/designer
        run: |
          & ./frontend/node_modules/.bin/tauri.cmd build --ci --bundles nsis `
            --config src-tauri/tauri.planner-bundle.conf.json --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject generated-source or lock drift
        run: git diff --exit-code -- Cargo.lock apps/designer/frontend/compiled
      - name: Stage and install the Planner validation bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($bundles.Count -ne 1) { throw "Expected one Planner NSIS bundle, found $($bundles.Count)." }
          $stage = 'dist/planner-validation/windows-host-nsis'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $installer = Join-Path $stage $bundles[0].Name
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $installer
          $installRoot = Join-Path $env:RUNNER_TEMP "pps-planner-install-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $installRoot) { throw 'Planner install directory is not fresh.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Planner NSIS install failed: $($process.ExitCode)." }
          $binary = Join-Path $installRoot 'pps-experiment-planner.exe'
          $worker = Join-Path $installRoot 'planner-worker/PPSPlannerWorker.exe'
          $renderer = Join-Path $installRoot 'planner-worker/_internal/third_party/3dti_renderer/bin/pps-3dti-renderer.exe'
          foreach ($item in @($binary, $worker, $renderer)) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw "Installed Planner file missing: $item" }
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $renderer).Hash -ne
              (Get-FileHash -Algorithm SHA256 -LiteralPath 'third_party/3dti_renderer/bin/pps-3dti-renderer.exe').Hash) {
            throw 'Installed 3DTI renderer differs from the reviewed source binary.'
          }
          @(
            'schema=pps-planner-packaging-validation.v1'
            "commit=${{ github.sha }}"
            'distribution_status=ci_validation_artifact_not_release'
            'use_for_data_collection=false'
            'signing=unsigned'
          ) | Set-Content -Encoding ascii (Join-Path $stage 'VALIDATION_ONLY.txt')
          "$((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant())  $($bundles[0].Name)" |
            Set-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')
          @(
            'schema=pps-planner-installed-inventory.v1'
            "commit=${{ github.sha }}"
            "binary_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant())"
            "worker_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $worker).Hash.ToLowerInvariant())"
            "renderer_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $renderer).Hash.ToLowerInvariant())"
            "frontend_html_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath 'apps/designer/frontend/compiled/index.html').Hash.ToLowerInvariant())"
          ) | Set-Content -Encoding ascii (Join-Path $stage 'INSTALL_INVENTORY.txt')
          "PPS_INSTALLED_PLANNER=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned installed-UI audit drivers
        run: python -m pip install --disable-pip-version-check playwright==1.61.0 pywinauto==0.6.9
      - name: Exercise installed Planner and all seven segment shells
        shell: pwsh
        run: |
          python For-AI/engineering/validation/scripts/run_installed_planner_webview_audit.py `
            --binary $env:PPS_INSTALLED_PLANNER `
            --output-dir artifacts/planner-installed-webview-audit `
            --commit '${{ github.sha }}' --elevated-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installed Planner audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planner-installed-webview-${{ github.sha }}
          path: artifacts/planner-installed-webview-audit
          if-no-files-found: warn
      - name: Retain Planner validation installer and inventory
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pps-planner-validation-windows-X64-${{ github.sha }}
          path: dist/planner-validation/windows-host-nsis
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  full-windows-validation:
    if: github.event_name != 'workflow_dispatch' || inputs.installed_artifact_run_id == ''
    name: Full two-app Windows validation bundle
    needs: [desktop-shell, browser-companion]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build both canonical web interfaces and the Runner binary
        shell: pwsh
        run: |
          npm --prefix apps/designer/frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/runner ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location apps/runner
          try {
            & ./node_modules/.bin/tauri.cmd build --ci --no-bundle --no-sign
            if ($LASTEXITCODE -ne 0) { throw "Runner production build failed: $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }
      - name: Build Planner worker against the single external Shared tree
        shell: pwsh
        run: |
          $env:PPS_PLANNER_EXTERNAL_SHARED = '1'
          ./For-AI/engineering/build/windows/Build_PPS_Planner_Worker.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build one Full NSIS installer
        shell: pwsh
        working-directory: apps/designer
        run: |
          & ./frontend/node_modules/.bin/tauri.cmd build --ci --bundles nsis `
            --config src-tauri/tauri.full-validation.conf.json --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject canonical frontend or lock drift
        run: git diff --exit-code -- Cargo.lock apps/designer/frontend/compiled apps/runner/compiled
      - name: Install and inventory the exact two-app package
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($bundles.Count -ne 1) { throw "Expected one Full NSIS bundle, found $($bundles.Count)." }
          $stage = 'dist/full-validation/windows-host-nsis'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $installer = Join-Path $stage "PPS-Research-Full-0.1.0-Windows-X64-Validation.exe"
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $installer
          $installRoot = Join-Path $env:RUNNER_TEMP "pps-full-install-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $installRoot) { throw 'Full install directory is not fresh.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Full NSIS install failed: $($process.ExitCode)." }
          python For-AI/engineering/release/tools/package_inventory.py --manifest-version v2 `
            --component full --stage-root $installRoot --strict `
            --output (Join-Path $stage 'INSTALLED_COMPONENT_INVENTORY.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed Full component bytes do not match source.' }
          foreach ($path in @('planner-worker/_internal/assets',
                              'planner-worker/_internal/study_templates',
                              'planner-worker/_internal/third_party')) {
            if (Test-Path -LiteralPath (Join-Path $installRoot $path)) {
              throw "Shared resource was duplicated in the Planner worker: $path"
            }
          }
          $shortcut = @(
            (Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/PPS Experiment Runner.lnk'),
            (Join-Path $env:ProgramData 'Microsoft/Windows/Start Menu/Programs/PPS Experiment Runner.lnk')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $shortcut) { throw 'Full installer did not create the Runner shortcut.' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne (Join-Path $installRoot 'runner/pps-experiment-runner.exe')) {
            throw "Runner shortcut points to the wrong executable: $target"
          }
          @(
            'schema=pps-full-packaging-validation.v2'
            "commit=${{ github.sha }}"
            'distribution_status=ci_validation_artifact_not_release'
            'use_for_data_collection=false'
            'signing=unsigned'
          ) | Set-Content -Encoding ascii (Join-Path $stage 'VALIDATION_ONLY.txt')
          "$((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($installer))" |
            Set-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS.txt')
          "PPS_FULL_INSTALLED_PLANNER=$(Join-Path $installRoot 'pps-experiment-planner.exe')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PPS_FULL_INSTALLED_RUNNER=$(Join-Path $installRoot 'runner/pps-experiment-runner.exe')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned installed-UI audit drivers
        run: python -m pip install --disable-pip-version-check playwright==1.61.0 pywinauto==0.6.9
      - name: Exercise both installed WebViews and native media paths
        shell: pwsh
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP "pps-full-planner-profile-${{ github.run_id }}-${{ github.run_attempt }}"
          $profile = Join-Path $profileRoot 'ci-planner-profile.json'
          python For-AI/engineering/validation/scripts/run_installed_planner_webview_audit.py `
            --binary $env:PPS_FULL_INSTALLED_PLANNER `
            --output-dir artifacts/full-planner-installed-webview-audit `
            --commit '${{ github.sha }}' --elevated-policy `
            --persistent-data-root $profileRoot --export-profile-path $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py `
            --binary $env:PPS_FULL_INSTALLED_RUNNER `
            --output-dir artifacts/full-runner-installed-webview-audit `
            --commit '${{ github.sha }}' --elevated-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py `
            --binary $env:PPS_FULL_INSTALLED_RUNNER `
            --output-dir artifacts/full-handoff-installed-webview-audit `
            --commit '${{ github.sha }}' --elevated-policy --profile-path $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Full reinstall and uninstall ownership
        shell: pwsh
        run: |
          $installRoot = Split-Path -Parent $env:PPS_FULL_INSTALLED_PLANNER
          $installer = 'dist/full-validation/windows-host-nsis/PPS-Research-Full-0.1.0-Windows-X64-Validation.exe'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Full reinstall failed: $($process.ExitCode)." }
          python For-AI/engineering/release/tools/package_inventory.py --manifest-version v2 `
            --component full --stage-root $installRoot --strict `
            --output 'dist/full-validation/windows-host-nsis/REINSTALLED_COMPONENT_INVENTORY.json'
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalled Full component bytes differ from source.' }
          $uninstaller = @(Get-ChildItem -LiteralPath $installRoot -Filter '*uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw "Expected one Full uninstaller, found $($uninstaller.Count)." }
          $process = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S' `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Full uninstall failed: $($process.ExitCode)." }
          foreach ($path in @('pps-experiment-planner.exe', 'runner/pps-experiment-runner.exe', 'shared/assets')) {
            if (Test-Path -LiteralPath (Join-Path $installRoot $path)) {
              throw "Full uninstall retained owned component: $path"
            }
          }
          $incompatibleRoot = Join-Path $env:RUNNER_TEMP "pps-incompatible-shared-${{ github.run_id }}-${{ github.run_attempt }}"
          $shared = Join-Path $incompatibleRoot 'shared'
          New-Item -ItemType Directory -Path $shared | Out-Null
          'legacy shared component' | Set-Content -Encoding ascii (Join-Path $shared 'legacy.marker')
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$incompatibleRoot") `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -eq 0 -or
              (Test-Path -LiteralPath (Join-Path $incompatibleRoot 'pps-experiment-planner.exe'))) {
            throw 'Full installer accepted an incompatible pre-existing Shared component.'
          }
          @('schema=pps-full-install-lifecycle.v1', "commit=${{ github.sha }}",
            'fresh_install=true', 'reinstall=true', 'uninstall=true',
            'incompatible_shared_rejected=true') |
            Set-Content -Encoding ascii 'dist/full-validation/windows-host-nsis/INSTALL_LIFECYCLE.txt'
      - name: Retain both installed WebView audits
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-installed-webviews-${{ github.sha }}
          path: |
            artifacts/full-planner-installed-webview-audit
            artifacts/full-runner-installed-webview-audit
            artifacts/full-handoff-installed-webview-audit
            dist/full-validation/windows-host-nsis/INSTALLED_COMPONENT_INVENTORY.json
          if-no-files-found: warn
      - name: Retain the single Full validation installer
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pps-research-full-validation-windows-X64-${{ github.sha }}
          path: dist/full-validation/windows-host-nsis
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
