name: Cross-platform Runner preview

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-audio-cpal/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-experiment-media/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_experiment_profile_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - "For-AI/engineering/tests/test_rust_response_differential.py"
      - "For-AI/engineering/tests/test_native_result_file_audit.py"
      - "For-AI/engineering/validation/scripts/validate_native_results.py"
      - "For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py"
      - ".github/workflows/runner-next.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-audio-cpal/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-experiment-media/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_experiment_profile_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - "For-AI/engineering/tests/test_rust_response_differential.py"
      - "For-AI/engineering/tests/test_native_result_file_audit.py"
      - "For-AI/engineering/validation/scripts/validate_native_results.py"
      - "For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py"
      - "For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py"
      - ".github/workflows/runner-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install Linux native-audio prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Check and test transport-neutral Rust crates
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Core

  desktop-shell:
    name: Tauri desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config
      - name: Check and test the native desktop shell
        env:
          PPS_NATIVE_RESULT_FIXTURE_DIR: ${{ runner.temp }}/native-result-fixture
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Desktop
      - name: Retain synthetic native writer files for the independent oracle
        uses: actions/upload-artifact@v7
        with:
          name: native-result-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/native-result-fixture
          if-no-files-found: error

  python-rust-package-oracle:
    name: Python/Rust V1 package oracle (${{ matrix.os }})
    needs: desktop-shell
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install the Python oracle and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Read the same host's synthetic native writer files
        uses: actions/download-artifact@v5
        with:
          name: native-result-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/native-result-fixture
      - name: Compare Rust verification with the Python V1 oracle
        env:
          PPS_NATIVE_RESULT_FIXTURE_DIR: ${{ runner.temp }}/native-result-fixture
        run: >-
          python -m pytest -q
          For-AI/engineering/tests/test_rust_session_package_differential.py
          For-AI/engineering/tests/test_rust_experiment_profile_differential.py
          For-AI/engineering/tests/test_rust_timing_schedule_differential.py
          For-AI/engineering/tests/test_rust_response_differential.py
          For-AI/engineering/tests/test_native_result_file_audit.py

  browser-companion:
    name: Browser companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build bundled browser frontend
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Browser
      - name: Install pinned rendered-UI audit tools
        run: |
          python -m pip install playwright==1.61.0 Pillow==12.2.0
          python -m playwright install --with-deps chromium
      - name: Audit rendered Runner profile controls
        run: python For-AI/engineering/validation/scripts/run_runner_profile_ui_audit.py
      - name: Retain rendered Runner profile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-profile-ui-${{ github.sha }}
          path: artifacts/runner-profile-ui-audit
          if-no-files-found: warn

  desktop-validation-bundle:
    name: Validation bundle (${{ matrix.slug }})
    needs: [desktop-shell, browser-companion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-host-nsis
            bundle: nsis
            bundle_glob: target/release/bundle/nsis/*-setup.exe
            signing: unsigned
            no_sign: true
          - os: macos-latest
            slug: macos-host-dmg
            bundle: dmg
            bundle_glob: target/release/bundle/dmg/*.dmg
            signing: ad-hoc-not-notarized
            no_sign: false
          - os: ubuntu-22.04
            slug: linux-host-deb
            bundle: deb
            bundle_glob: target/release/bundle/deb/*.deb
            signing: unsigned
            no_sign: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: actions/setup-python@v5
        if: matrix.slug == 'windows-host-nsis'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux Tauri packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install locked frontend dependencies
        working-directory: apps/runner
        run: npm ci
      - name: Build one host-native validation bundle
        shell: pwsh
        working-directory: apps/runner
        run: |
          $arguments = @(
            "run", "tauri", "--", "build",
            "--ci",
            "--bundles", "${{ matrix.bundle }}",
            "--config", "src-tauri/tauri.validation.conf.json"
          )
          if ("${{ matrix.no_sign }}" -eq "true") {
            $arguments += "--no-sign"
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Reject generated-source or lock drift
        run: git diff --exit-code -- Cargo.lock apps/runner/compiled
      - name: Stage validation-only artifact
        id: stage_validation
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path "${{ matrix.bundle_glob }}" -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.bundle }} bundle, found $($bundles.Count)."
          }

          $unexpectedUpdaterFiles = @(
            Get-ChildItem target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -eq ".sig" -or $_.Name -eq "latest.json" }
          )
          if ($unexpectedUpdaterFiles.Count -ne 0) {
            throw "Validation builds must not create updater artifacts."
          }

          $stage = "dist/runner-validation/${{ matrix.slug }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $destination = Join-Path $stage $bundles[0].Name
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $destination

          @(
            "schema=pps-runner-packaging-validation.v1"
            "commit=${{ github.sha }}"
            "runner_os=${{ runner.os }}"
            "runner_arch=${{ runner.arch }}"
            "bundle=${{ matrix.bundle }}"
            "signing=${{ matrix.signing }}"
            "distribution_status=ci_validation_artifact_not_release"
            "scientific_status=single_block_native_candidate_unqualified"
            "use_for_data_collection=false"
            "updater=false"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "VALIDATION_ONLY.txt")

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $destination
          "$($hash.Hash.ToLowerInvariant())  $($bundles[0].Name)" |
            Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
      - name: Check fresh Windows installer inventory
        if: matrix.slug == 'windows-host-nsis'
        shell: pwsh
        run: |
          $stage = "dist/runner-validation/windows-host-nsis"
          $installer = @(Get-ChildItem -LiteralPath $stage -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one staged NSIS installer." }
          $installRoot = Join-Path $env:RUNNER_TEMP "pps-runner-install-${{ github.run_id }}-${{ github.run_attempt }}"
          if ($installRoot -match '\s' -or (Test-Path -LiteralPath $installRoot)) {
            throw "The CI install directory must be fresh and contain no spaces."
          }
          $process = Start-Process -FilePath $installer[0].FullName `
            -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS silent install failed: $($process.ExitCode)." }
          $binary = Join-Path $installRoot 'pps-experiment-runner.exe'
          $installedHtml = Join-Path $installRoot 'web/index.html'
          $installedCss = Join-Path $installRoot 'web/assets/style.css'
          foreach ($path in @($binary, $installedHtml, $installedCss)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "The installed Runner inventory is incomplete: $path"
            }
          }
          $htmlHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedHtml).Hash.ToLowerInvariant()
          $cssHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installedCss).Hash.ToLowerInvariant()
          if ($htmlHash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'apps/runner/compiled/index.html').Hash.ToLowerInvariant() -or
              $cssHash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath 'apps/runner/compiled/assets/style.css').Hash.ToLowerInvariant()) {
            throw "Installed frontend resource bytes differ from the canonical compiled files."
          }
          @(
            'schema=pps-runner-installed-inventory.v1'
            "commit=${{ github.sha }}"
            'scope=ci_silent_install_inventory_only'
            "binary_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant())"
            "html_sha256=$htmlHash"
            "css_sha256=$cssHash"
            'webview_launched=false'
            'physical_output_qualified=false'
          ) | Set-Content -Encoding ascii (Join-Path $stage 'INSTALL_INVENTORY.txt')
          "PPS_INSTALLED_RUNNER=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned WebView audit driver
        if: matrix.slug == 'windows-host-nsis'
        run: python -m pip install --disable-pip-version-check playwright==1.61.0
      - name: Exercise the installed Runner WebView and native snapshot
        if: matrix.slug == 'windows-host-nsis'
        shell: pwsh
        run: |
          $audit = 'artifacts/runner-installed-webview-audit'
          python For-AI/engineering/validation/scripts/run_installed_runner_webview_audit.py `
            --binary $env:PPS_INSTALLED_RUNNER --output-dir $audit --commit '${{ github.sha }}' --elevated-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -LiteralPath (Join-Path $audit 'report.json') -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.commit -ne '${{ github.sha }}') {
            throw 'Installed WebView audit report does not match this build.'
          }
          $stage = 'dist/runner-validation/windows-host-nsis'
          Copy-Item -LiteralPath (Join-Path $audit 'report.json') -Destination (Join-Path $stage 'WEBVIEW_AUDIT.json')
          $inventory = Join-Path $stage 'INSTALL_INVENTORY.txt'
          (Get-Content -LiteralPath $inventory) `
            -replace 'scope=ci_silent_install_inventory_only', 'scope=ci_silent_install_and_webview_audit' `
            -replace 'webview_launched=false', 'webview_launched=true' |
            Set-Content -Encoding ascii -LiteralPath $inventory
          "webview_audit_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $stage 'WEBVIEW_AUDIT.json')).Hash.ToLowerInvariant())" |
            Add-Content -Encoding ascii -LiteralPath $inventory
      - name: Retain installed WebView screenshots and failure report
        if: always() && matrix.slug == 'windows-host-nsis'
        uses: actions/upload-artifact@v7
        with:
          name: runner-installed-webview-${{ github.sha }}
          path: artifacts/runner-installed-webview-audit
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always() && steps.stage_validation.outcome == 'success'
        with:
          name: pps-runner-preview-validation-${{ matrix.slug }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/runner-validation/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quest-apk:
    name: Optional native Quest APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android toolchain
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Test, build, and lint the native Quest preview
        working-directory: apps/quest-runner
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
