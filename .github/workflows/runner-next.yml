name: Cross-platform Runner preview

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - ".github/workflows/runner-next.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "pyproject.toml"
      - "apps/quest-runner/**"
      - "apps/runner/**"
      - "packages/pps-brsp/**"
      - "packages/pps-contracts/**"
      - "packages/pps-runner-core/**"
      - "packages/pps-runner-audio/**"
      - "packages/pps-runner-execution/**"
      - "packages/pps-session-package/**"
      - "packages/pps-resources/assets/app/pps_toolkit_icon.*"
      - "packages/pps-runtime/src/peripersonal_space_toolkit/**"
      - "For-AI/engineering/automation/check_runner_next.ps1"
      - "For-AI/engineering/tests/test_rust_session_package_differential.py"
      - "For-AI/engineering/tests/test_rust_timing_schedule_differential.py"
      - ".github/workflows/runner-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Check and test transport-neutral Rust crates
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Core

  desktop-shell:
    name: Tauri desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check and test the native desktop shell
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Desktop

  python-rust-package-oracle:
    name: Python/Rust V1 package oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install the Python oracle and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compare Rust verification with the Python V1 oracle
        run: >-
          python -m pytest -q
          For-AI/engineering/tests/test_rust_session_package_differential.py
          For-AI/engineering/tests/test_rust_timing_schedule_differential.py

  browser-companion:
    name: Browser companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - name: Test and build bundled browser frontend
        shell: pwsh
        run: ./For-AI/engineering/automation/check_runner_next.ps1 -Mode Browser

  desktop-validation-bundle:
    name: Validation bundle (${{ matrix.slug }})
    needs: [desktop-shell, browser-companion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-host-nsis
            bundle: nsis
            bundle_glob: target/release/bundle/nsis/*-setup.exe
            signing: unsigned
            no_sign: true
          - os: macos-latest
            slug: macos-host-dmg
            bundle: dmg
            bundle_glob: target/release/bundle/dmg/*.dmg
            signing: ad-hoc-not-notarized
            no_sign: false
          - os: ubuntu-22.04
            slug: linux-host-deb
            bundle: deb
            bundle_glob: target/release/bundle/deb/*.deb
            signing: unsigned
            no_sign: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/runner/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux Tauri packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install locked frontend dependencies
        working-directory: apps/runner
        run: npm ci
      - name: Build one host-native validation bundle
        shell: pwsh
        working-directory: apps/runner
        run: |
          $arguments = @(
            "run", "tauri", "--", "build",
            "--ci",
            "--bundles", "${{ matrix.bundle }}",
            "--config", "src-tauri/tauri.validation.conf.json"
          )
          if ("${{ matrix.no_sign }}" -eq "true") {
            $arguments += "--no-sign"
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Reject generated-source or lock drift
        run: git diff --exit-code -- Cargo.lock apps/runner/compiled
      - name: Stage validation-only artifact
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path "${{ matrix.bundle_glob }}" -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.bundle }} bundle, found $($bundles.Count)."
          }

          $unexpectedUpdaterFiles = @(
            Get-ChildItem target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -eq ".sig" -or $_.Name -eq "latest.json" }
          )
          if ($unexpectedUpdaterFiles.Count -ne 0) {
            throw "Validation builds must not create updater artifacts."
          }

          $stage = "dist/runner-validation/${{ matrix.slug }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $destination = Join-Path $stage $bundles[0].Name
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $destination

          @(
            "schema=pps-runner-packaging-validation.v1"
            "commit=${{ github.sha }}"
            "runner_os=${{ runner.os }}"
            "runner_arch=${{ runner.arch }}"
            "bundle=${{ matrix.bundle }}"
            "signing=${{ matrix.signing }}"
            "distribution_status=ci_validation_artifact_not_release"
            "scientific_status=preview_only_real_packages_not_executable"
            "use_for_data_collection=false"
            "updater=false"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "VALIDATION_ONLY.txt")

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $destination
          "$($hash.Hash.ToLowerInvariant())  $($bundles[0].Name)" |
            Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")
      - uses: actions/upload-artifact@v7
        with:
          name: pps-runner-preview-validation-${{ matrix.slug }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/runner-validation/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quest-apk:
    name: Optional native Quest APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Test, build, and lint the native Quest preview
        working-directory: apps/quest-runner
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
