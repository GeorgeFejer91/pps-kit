[workspace]
resolver = "2"
members = [
    "packages/pps-contracts",
    "packages/pps-brsp",
    "packages/pps-runner-core",
    "packages/pps-runner-audio",
    "packages/pps-runner-execution",
    "packages/pps-session-package",
    "apps/runner/src-tauri",
    "apps/quest-runner/native/pps-quest-core",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/GeorgeFejer91/pps-kit"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22"
csv = "1"
hmac = "0.12"
hound = "=3.5.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
