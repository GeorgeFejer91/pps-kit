<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPS Trajectory Viewer</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11100e;
      color: #f2e7d8;
      font-family: Arial, Helvetica, sans-serif;
    }
    #viewer {
      width: 100%;
      height: 100%;
    }
    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      left: 14px;
      top: 12px;
      max-width: calc(50% - 42px);
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid rgba(242, 231, 216, 0.18);
      background: rgba(17, 16, 14, 0.58);
      border-radius: 6px;
      line-height: 1.35;
      overflow-wrap: break-word;
      font-size: 12px;
      pointer-events: none;
    }
    #hud strong {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
    }
    @media (max-width: 480px) {
      #hud {
        inset: auto 10px 10px;
        max-width: calc(100% - 20px);
        width: fit-content;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewer" data-viewer-ready="false"></div>
  <div id="hud">
    <strong>2D Sound Path</strong>
    <span id="viewer-status">Loading...</span>
  </div>
  <script type="module">
    const version = new URLSearchParams(window.location.search).get("v") || "local";
    import(`./trajectory-viewer.js?v=${encodeURIComponent(version)}`);
  </script>
</body>
</html>
