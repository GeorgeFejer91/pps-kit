[package]
name = "pps-experiment-designer"
version = "0.1.0"
description = "PPS Experiment Designer native preparation host"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pps_experiment_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pps-experiment-designer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pps-designer-core = { path = "../../../packages/pps-designer-core" }
pps-session-package = { path = "../../../packages/pps-session-package" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hound = "3.5.1"
percent-encoding = "2.3.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
