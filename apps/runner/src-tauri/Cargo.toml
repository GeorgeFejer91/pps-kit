[package]
name = "pps-experiment-runner"
version = "0.1.0"
description = "Cross-platform PPS Experiment Runner preview"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pps_experiment_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pps-experiment-runner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
local-ip-address = "0.6"
pps-brsp = { path = "../../../packages/pps-brsp" }
pps-contracts = { path = "../../../packages/pps-contracts" }
pps-runner-core = { path = "../../../packages/pps-runner-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
