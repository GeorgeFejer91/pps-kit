<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPS Study Preview</title>
  <meta name="description" content="Preview PPS studies in your browser with premade stimuli. Download the desktop suite to generate stimuli and run experiments.">
  <meta name="theme-color" content="#f4f5f1">
  <link rel="manifest" href="study-preview.webmanifest">
  <script type="module">
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./study-preview-sw.js", { updateViaCache: "none" })
        .catch((error) => console.warn("Offline study preview could not be enabled.", error));
    }
  </script>
  <link rel="icon" type="image/png" href="app/pps_toolkit_icon.png">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #f4f5f1;
    }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #f4f5f1;
    }

    .fallback {
      position: fixed;
      inset: auto 1rem 1rem 1rem;
      z-index: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #ccd3cb;
      border-radius: 8px;
      background: #ffffff;
      color: #202621;
      font-family: "Aptos", "Noto Sans", "Helvetica Neue", sans-serif;
      box-shadow: 0 10px 24px rgba(21, 28, 24, 0.12);
    }

    .fallback a {
      color: #246b55;
      font-weight: 700;
    }

    @media (scripting: enabled) {
      .fallback {
        display: none;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="dashboard-frame"
    title="PPS Study Preview"
    src="app/index.html?page=toolkit&v=20260823-modular-monorepo"
  ></iframe>
  <noscript>
    <div class="fallback">
      JavaScript is required for the dashboard.
      <a href="app/index.html?page=toolkit&v=20260823-modular-monorepo">Open the study preview directly</a>.
    </div>
  </noscript>
</body>
</html>
